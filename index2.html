<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HABIBI — Marrakech</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0808;
    --accent: #8B1A1A;
    --accent2: #5C0F0F;
    --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }

  html { scroll-behavior: auto; }

  body {
    background: var(--bg);
    color: #fff;
    font-family: var(--font);
    overflow-x: hidden;
  }

  /* ─── LOADER ─── */
  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  .loader-logo {
    width: 80px;
    opacity: 0;
    animation: loaderFadeIn 0.6s ease 0.3s forwards;
  }
  .loader-bar-wrap {
    margin-top: 32px;
    width: 120px;
    height: 1px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .loader-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.05s linear;
  }
  .loader-pct {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: rgba(255,255,255,0.3);
    font-weight: 300;
  }
  @keyframes loaderFadeIn { to { opacity: 1; } }

  /* ─── HEADER ─── */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
  }
  #header img.logo {
    height: 48px;
    width: auto;
    display: block;
  }
  #header nav {
    display: flex;
    gap: 40px;
  }
  #header nav span {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 100;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #fff;
    cursor: default;
    user-select: none;
  }

  /* ─── SCROLL CONTAINER ─── */
  #scroll-container {
    position: relative;
  }

  /* sticky canvas stage */
  #canvas-stage {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  #frame-canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* film grain */
  #grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.045;
    z-index: 2;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    animation: grainAnim 0.12s steps(1) infinite;
  }
  @keyframes grainAnim {
    0%   { background-position: 0 0; }
    10%  { background-position: -5% -10%; }
    20%  { background-position: -15% 5%; }
    30%  { background-position: 7% -25%; }
    40%  { background-position: -5% 25%; }
    50%  { background-position: -15% 10%; }
    60%  { background-position: 15% 0%; }
    70%  { background-position: 0 15%; }
    80%  { background-position: 3% 35%; }
    90%  { background-position: -10% 10%; }
    100% { background-position: 0 0; }
  }

  /* vignette — heavier, multi-layer for cinematic depth */
  #vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background:
      radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.88) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, transparent 18%, transparent 72%, rgba(0,0,0,0.65) 100%);
  }

  /* side gradient overlays — left and right */
  #overlay-left, #overlay-right {
    position: absolute;
    top: 0; bottom: 0;
    width: 55%;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  #overlay-left {
    left: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
  }
  #overlay-right {
    right: 0;
    background: linear-gradient(to left, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
  }

  /* spacer that drives scroll */
  #scroll-spacer {
    /* will be set by JS */
  }

  /* ─── SCROLL HINT (intro only) ─── */
  #scroll-hint {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transition: opacity 0.7s ease;
    pointer-events: none;
    animation: hintFloat 2.8s ease-in-out infinite;
  }
  #scroll-hint.visible { opacity: 1; }
  @keyframes hintFloat {
    0%   { transform: translateX(-50%) translateY(0px); }
    50%  { transform: translateX(-50%) translateY(-10px); }
    100% { transform: translateX(-50%) translateY(0px); }
  }
  .hint-text {
    font-size: 10px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.45em;
    color: #fff;
    padding: 7px 18px 6px;
    border-radius: 100px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px) saturate(1.4);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 2px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
  }
  .hint-arrow {
    width: 1px;
    height: 36px;
    background: linear-gradient(to bottom, var(--accent), transparent);
    animation: hintDrop 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  @keyframes hintDrop {
    0%   { transform: scaleY(0); transform-origin: top; opacity: 0; }
    35%  { transform: scaleY(1); transform-origin: top; opacity: 1; }
    75%  { transform: scaleY(1); transform-origin: bottom; opacity: 0; }
    100% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
  }

  /* ─── TEXT SECTIONS ─── */
  .text-section {
    position: absolute;
    top: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 64px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.55s ease, transform 0.55s ease;
    pointer-events: none;
    z-index: 10;
    max-width: 560px;
  }
  .text-section.left  { left: 0; }
  .text-section.right { right: 0; left: auto; }
  .text-section.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .text-overline {
    display: inline-block;
    align-self: flex-start;
    font-size: 10px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.45em;
    color: var(--accent);
    margin-bottom: 22px;
    padding: 7px 18px 6px;
    border-radius: 100px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px) saturate(1.4);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 2px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.07);
    transition: background 0.4s ease, border-color 0.4s ease;
  }

  .text-headline {
    font-size: clamp(38px, 4.8vw, 80px);
    font-weight: 200;
    line-height: 1.12;
    letter-spacing: 0.02em;
    color: #fff;
  }

  /* ─── ENDING SECTION ─── */
  #ending {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 80px 24px;
  }

  .ending-logo {
    height: clamp(72px, 10vw, 140px);
    width: auto;
    display: block;
    margin: 0 auto;
  }

  .ending-line {
    width: 60px;
    height: 1px;
    background: var(--accent);
    margin: 32px auto 28px;
  }

  .ending-coming {
    font-family: var(--font);
    font-size: clamp(72px, 10vw, 140px);
    font-weight: 100;
    text-transform: uppercase;
    letter-spacing: 0.35em;
    color: var(--accent);
    line-height: 1;
  }

  .ending-location {
    margin-top: 16px;
    font-family: var(--font);
    font-size: clamp(11px, 1.2vw, 14px);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.4em;
    color: rgba(255,255,255,0.25);
  }

  /* ─── MOBILE NAV ─── */
  @media (max-width: 768px) {
    #header { padding: 16px 24px; }
    #header nav { display: none; }
    .text-section { padding: 0 28px; max-width: 90vw; }
    .text-headline { font-size: clamp(28px, 7vw, 52px); }
    #scroll-hint { bottom: 32px; }
  }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <img class="loader-logo" src="assets/logo.webp" alt="HABIBI">
  <div class="loader-bar-wrap"><div class="loader-bar" id="loader-bar"></div></div>
  <div class="loader-pct" id="loader-pct">0%</div>
</div>

<!-- HEADER -->
<header id="header">
  <img class="logo" src="assets/logo.webp" alt="HABIBI">
  <nav>
    <span>Concept</span>
    <span>Experience</span>
    <span>Reservation</span>
    <span>Contact</span>
  </nav>
</header>

<!-- SCROLL SECTION -->
<div id="scroll-container">
  <div id="canvas-stage">
    <img id="frame-canvas" src="" alt="">
    <div id="grain"></div>
    <div id="vignette"></div>
    <div id="overlay-left"></div>
    <div id="overlay-right"></div>

    <!-- Intro scroll hint — visible during frames 0–159 -->
    <div id="scroll-hint">
      <div class="hint-text">Scroll to discover</div>
      <div class="hint-arrow"></div>
    </div>

    <!-- Section 1: frames 160–250 — left -->
    <div class="text-section left" id="section-1">
      <div class="text-overline">Marrakech</div>
      <div class="text-headline">The city has a new secret.</div>
    </div>

    <!-- Section 2: frames 251–340 — left -->
    <div class="text-section left" id="section-2">
      <div class="text-overline">Habibi</div>
      <div class="text-headline">You weren't supposed to see this yet.</div>
    </div>

    <!-- Section 3: frames 341–435 — left -->
    <div class="text-section left" id="section-3">
      <div class="text-overline">The Space</div>
      <div class="text-headline">A room designed to make you forget what time it is.</div>
    </div>

    <!-- Section 4: frames 436–525 — right -->
    <div class="text-section right" id="section-4">
      <div class="text-overline">The Menu</div>
      <div class="text-headline">Each plate, a reason to come back.</div>
    </div>
  </div>

  <!-- Scroll spacer — height set by JS -->
  <div id="scroll-spacer"></div>
</div>

<!-- ENDING -->
<section id="ending">
  <img class="ending-logo" src="assets/logo.webp" alt="HABIBI">
  <div class="ending-line"></div>
  <div class="ending-coming">Coming Soon</div>
  <div class="ending-location">Marrakech</div>
</section>

<script>
(function () {
  'use strict';

  const TOTAL_FRAMES = 526;
  const DWELL_PX = 600;

  // Intro: frames 0–159 (no text, scroll hint visible)
  // Narrative sections start at frame 160, matching original 4-section timing
  const INTRO_END = 159;
  const SECTIONS = [
    { id: 'section-1', start: 160, end: 250, side: 'left'  },
    { id: 'section-2', start: 251, end: 340, side: 'left'  },
    { id: 'section-3', start: 341, end: 435, side: 'left'  },
    { id: 'section-4', start: 436, end: 525, side: 'right' },
  ];

  const isMobile = () => window.innerWidth <= 768;
  const frameDir = () => isMobile() ? 'assets/frames2/mobile' : 'assets/frames2/desktop';
  const frameSrc = (n) => `${frameDir()}/frame_${String(n + 1).padStart(4, '0')}.jpg`;

  // ── Preload all frames ──────────────────────────────────────────
  const images = new Array(TOTAL_FRAMES);
  let loadedCount = 0;
  const loaderBar = document.getElementById('loader-bar');
  const loaderPct = document.getElementById('loader-pct');
  const loader = document.getElementById('loader');

  function onFrameLoad() {
    loadedCount++;
    const pct = Math.round((loadedCount / TOTAL_FRAMES) * 100);
    loaderBar.style.width = pct + '%';
    loaderPct.textContent = pct + '%';
    if (loadedCount === TOTAL_FRAMES) {
      setTimeout(() => {
        loader.classList.add('hidden');
        setTimeout(() => { loader.style.display = 'none'; }, 900);
        init();
      }, 300);
    }
  }

  for (let i = 0; i < TOTAL_FRAMES; i++) {
    const img = new Image();
    img.src = frameSrc(i);
    img.onload = img.onerror = onFrameLoad;
    images[i] = img;
  }

  // ── Init after load ─────────────────────────────────────────────
  function init() {
    const canvas = document.getElementById('frame-canvas');
    const spacer = document.getElementById('scroll-spacer');
    const overlayLeft = document.getElementById('overlay-left');
    const overlayRight = document.getElementById('overlay-right');
    const scrollHint = document.getElementById('scroll-hint');

    // 5 scroll beats: 1 intro + 4 narrative sections, each with dwell
    const BEAT_COUNT = 5;
    const totalScrollH = (window.innerHeight * BEAT_COUNT) + (DWELL_PX * BEAT_COUNT);
    spacer.style.height = totalScrollH + 'px';

    canvas.src = images[0].src;
    scrollHint.classList.add('visible');

    let currentFrame = 0;

    function getFrameForScroll(scrollY) {
      const progress = Math.max(0, Math.min(1, scrollY / totalScrollH));
      return Math.min(TOTAL_FRAMES - 1, Math.floor(progress * TOTAL_FRAMES));
    }

    function getSectionForFrame(frame) {
      for (const s of SECTIONS) {
        if (frame >= s.start && frame <= s.end) return s;
      }
      return null;
    }

    let raf;
    let lastScrollY = -1;

    function onScroll() {
      if (raf) return;
      raf = requestAnimationFrame(tick);
    }

    function tick() {
      raf = null;
      const scrollY = window.scrollY;
      if (scrollY === lastScrollY) return;
      lastScrollY = scrollY;

      const frame = getFrameForScroll(scrollY);
      if (frame !== currentFrame) {
        currentFrame = frame;
        canvas.src = images[frame].src;
      }

      // Scroll hint: visible during intro, fades out as soon as narrative begins
      if (frame <= INTRO_END) {
        // Fade hint out as intro nears its end
        const introProgress = frame / INTRO_END;
        const hintOpacity = introProgress > 0.75 ? 1 - ((introProgress - 0.75) / 0.25) : 1;
        scrollHint.style.opacity = Math.max(0, hintOpacity).toFixed(3);
      } else {
        scrollHint.style.opacity = '0';
      }

      // Section visibility
      const active = getSectionForFrame(frame);
      SECTIONS.forEach(s => {
        const el = document.getElementById(s.id);
        if (active && active.id === s.id) {
          el.classList.add('visible');
        } else {
          el.classList.remove('visible');
        }
      });

      // Side overlays
      if (active && active.side === 'left') {
        overlayLeft.style.opacity = '1';
        overlayRight.style.opacity = '0';
      } else if (active && active.side === 'right') {
        overlayLeft.style.opacity = '0';
        overlayRight.style.opacity = '1';
      } else {
        overlayLeft.style.opacity = '0';
        overlayRight.style.opacity = '0';
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });

    window.addEventListener('resize', () => {
      for (let i = 0; i < TOTAL_FRAMES; i++) {
        const img = new Image();
        img.src = frameSrc(i);
        images[i] = img;
      }
      const newH = (window.innerHeight * BEAT_COUNT) + (DWELL_PX * BEAT_COUNT);
      spacer.style.height = newH + 'px';
    });
  }
})();
</script>
</body>
</html>
